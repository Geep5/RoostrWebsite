[workspace]
resolver = "3"
members = ["crates/*"]
# The iPhone app stays on GPUI (main branch) until Rune has iOS text input.
exclude = ["crates/roostr-ios"]
default-members = ["crates/roostr"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
roostr-core = { path = "crates/roostr-core" }
roostr-rt = { path = "crates/roostr-rt" }
roostr-host = { path = "crates/roostr-host" }
roostr-ui = { path = "crates/roostr-ui" }
roostr-properties = { path = "crates/roostr-properties" }
roostr-editor = { path = "crates/roostr-editor" }
roostr-sets = { path = "crates/roostr-sets" }
roostr-discussion = { path = "crates/roostr-discussion" }
roostr-graph = { path = "crates/roostr-graph" }
roostr-settings = { path = "crates/roostr-settings" }
roostr-site = { path = "crates/roostr-site" }
roostr-shell = { path = "crates/roostr-shell" }
roostr-app = { path = "crates/roostr-app" }
roostr-nostr = { path = "crates/roostr-nostr" }
roostr-engine = { path = "crates/roostr-engine" }
roostr-replica-store = { path = "crates/roostr-replica-store" }
roostr-replica = { path = "crates/roostr-replica" }
# Rune is pre-release: pin a `dev` rev (dev is fast-forward only).
rune = { git = "https://github.com/anomalyco/rune", rev = "8e3fc8e" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "8e3fc8e" }
gpui-kit = "0.9.1"
# Interruptible tweens, springs and presence on gpui-kit; see
# roostr_core::motion and vendor/gpui-motion-kit.
gpui-motion-kit = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
dirs = "6"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
parking_lot = "0.12"
# debug-embed: compile the assets in for every profile. Without it a debug
# build reads them from the source tree at run time, which a browser tab
# (`build-web.sh --debug`) or a phone cannot: every icon drew blank.
rust-embed = { version = "8", features = ["debug-embed"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"
fancy-regex = "0.16"
percent-encoding = "2"
gpui-pre-reqwest-client = "0.3.12"
web-time = "1"
# Browser build (wasm32-unknown-unknown). wasm-bindgen must match the
# `wasm-bindgen` CLI that scripts/build-web.sh runs (it reads Cargo.lock).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-test = "0.3"
sha2 = "0.10"

# Decoding the landing page's 60-frame WebP takes ~15 s unoptimized; a few
# seconds of extra first build buys an instant hero in debug builds.
# Disk: Rune links into every test and example binary; full debug info made the
# target grow by tens of gigabytes. Line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

# The browser build (scripts/build-web.sh): one size-optimized, stripped
# module - 28 MB (7.7 MB brotli) against 35 MB (8.7 MB) at opt-level 3. The
# desktop keeps the plain release profile.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# The iOS app's renderer, emoji fallback and color rasterization (see
# vendor/gpui-fast-apple/Cargo.toml), the iOS platform's additions (see
# vendor/gpui-pre-ios/Cargo.toml; gpui-fast-platform names it on iOS, so the
# vendored copy replaces it there too), the browser's touch hover (see
# vendor/gpui-fast-web/Cargo.toml), gpui-motion's clock on wasm (see
# vendor/gpui-motion-kit/Cargo.toml), and touch pans that keep to one axis
# (see vendor/gpui-fast/Cargo.toml).
[patch.crates-io]
# GPUI Fast in place of gpui-pre: GPUI Kit's gpui-pre crates are shims
# re-exporting it (vendor/compat), and its core and web carry our patches.
gpui-pre = { path = "vendor/compat/gpui-pre" }
gpui-pre-macros = { path = "vendor/compat/gpui-pre-macros" }
gpui-pre-platform = { path = "vendor/compat/gpui-pre-platform" }
gpui-pre-web = { path = "vendor/compat/gpui-pre-web" }
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-web = { path = "vendor/gpui-fast-web" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }
gpui-pre-ios = { path = "vendor/gpui-pre-ios" }
gpui-motion-kit = { path = "vendor/gpui-motion-kit" }
gpui-ce-motion = { path = "vendor/gpui-ce-motion" }
