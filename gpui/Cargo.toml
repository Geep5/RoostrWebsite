[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/roostr"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
roostr-core = { path = "crates/roostr-core" }
roostr-rt = { path = "crates/roostr-rt" }
roostr-host = { path = "crates/roostr-host" }
roostr-ui = { path = "crates/roostr-ui" }
roostr-properties = { path = "crates/roostr-properties" }
roostr-editor = { path = "crates/roostr-editor" }
roostr-sets = { path = "crates/roostr-sets" }
roostr-discussion = { path = "crates/roostr-discussion" }
roostr-graph = { path = "crates/roostr-graph" }
roostr-settings = { path = "crates/roostr-settings" }
roostr-site = { path = "crates/roostr-site" }
roostr-shell = { path = "crates/roostr-shell" }
roostr-app = { path = "crates/roostr-app" }
roostr-nostr = { path = "crates/roostr-nostr" }
roostr-engine = { path = "crates/roostr-engine" }
roostr-replica-store = { path = "crates/roostr-replica-store" }
roostr-replica = { path = "crates/roostr-replica" }
roostr-direct = { path = "crates/roostr-direct" }
# Rune is pre-release: pin a `dev` rev (dev is fast-forward only).
rune = { git = "https://github.com/anomalyco/rune", rev = "8e3fc8e" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "8e3fc8e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
dirs = "6"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
parking_lot = "0.12"
# debug-embed: compile the assets in for every profile. Without it a debug
# build reads them from the source tree at run time, which a browser tab
# (`build-web.sh --debug`) or a phone cannot: every icon drew blank.
rust-embed = { version = "8", features = ["debug-embed"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"
fancy-regex = "0.16"
percent-encoding = "2"
web-time = "1"
# Browser build (wasm32-unknown-unknown). wasm-bindgen must match the
# `wasm-bindgen` CLI that scripts/build-web.sh runs (it reads Cargo.lock).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-test = "0.3"
sha2 = "0.10"

# Decoding the landing page's 60-frame WebP takes ~15 s unoptimized; a few
# seconds of extra first build buys an instant hero in debug builds.
# Disk: Rune links into every test and example binary; full debug info made the
# target grow by tens of gigabytes. Line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

# The browser build (scripts/build-web.sh): one size-optimized, stripped
# module - 28 MB (7.7 MB brotli) against 35 MB (8.7 MB) at opt-level 3. The
# desktop keeps the plain release profile.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
