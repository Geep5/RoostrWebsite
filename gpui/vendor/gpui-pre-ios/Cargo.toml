# Zed's `gpui_ios` as published in gpui-pre-ios 0.3.9 (a snapshot of
# zed@b4ecc45), vendored because that snapshot is newer than the gpui-pre
# 0.3.9 core (zed@93d7456) it pins with `=0.3.9`: it names five APIs the core
# does not have. The changes are marked `roostr:` in src/ios/; examples and
# tests are dropped, and the crate builds as an rlib only (roostr-ios is the
# staticlib).

[package]
edition = "2024"
name = "gpui-pre-ios"
version = "0.3.9"
build = false
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Zed's `gpui_ios` crate (gpui-pre snapshot of zed@b4ecc45)"
readme = false
license = "Apache-2.0"
repository = "https://github.com/zed-industries/zed"

[package.metadata.gpui-pre]
zed-crate = "gpui_ios"
zed-version = "0.1.0"
zed-rev = "b4ecc454225fc1819e37e890b62df5473b2ba95b"

[features]
runtime_shaders = ["gpui_apple/runtime_shaders"]

[lib]
name = "gpui_ios"
crate-type = ["rlib"]
path = "src/gpui_ios.rs"
doctest = false

[dependencies.gpui]
version = "=0.3.9"
default-features = false
package = "gpui-pre"

[target.'cfg(target_os = "ios")'.dependencies.anyhow]
version = "1.0.86"

[target.'cfg(target_os = "ios")'.dependencies.block2]
version = "0.6"

[target.'cfg(target_os = "ios")'.dependencies.futures]
version = "0.3.34"

[target.'cfg(target_os = "ios")'.dependencies.gpui_apple]
version = "=0.3.9"
features = ["font-kit"]
package = "gpui-pre-apple"

[target.'cfg(target_os = "ios")'.dependencies.log]
version = "0.4"
features = ["std"]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "ios")'.dependencies.objc2-core-foundation]
version = "0.3.2"
default-features = true

[target.'cfg(target_os = "ios")'.dependencies.objc2-foundation]
version = "0.3.2"
features = [
    "NSArray",
    "NSAttributedString",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
    "std",
    "NSThread",
    "NSOperation",
    "block2",
]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2-quartz-core]
version = "0.3.2"
features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "CADisplayLink",
]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.objc2-ui-kit]
version = "0.3.2"
features = [
    "std",
    "block2",
    "objc2-quartz-core",
    "objc2-core-foundation",
    "NSText",
    "UIApplication",
    "UIDocumentPickerViewController",
    "UIEvent",
    "UIGeometry",
    "UIInterface",
    "UIOpenURLContext",
    "UIPasteboard",
    "UIResponder",
    "UIScene",
    "UISceneConfiguration",
    "UISceneDefinitions",
    "UISceneOptions",
    "UISceneSession",
    "UIScreen",
    "UITextInput",
    "UITextInputTraits",
    "UITouch",
    "UITraitCollection",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
]
default-features = false

[target.'cfg(target_os = "ios")'.dependencies.parking_lot]
version = "0.12.1"

[target.'cfg(target_os = "ios")'.dependencies.raw-window-handle]
version = "0.6"

[target.'cfg(target_os = "ios")'.dependencies.uuid]
version = "1.1"
features = [
    "serde",
    "v5",
]

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
