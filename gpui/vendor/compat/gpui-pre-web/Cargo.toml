# gpui-fast-web under the name and version GPUI Kit 0.9.1 pins (gpui-pre-web =0.3.12),
# so GPUI Kit and everything built on gpui-pre run on GPUI Fast - after
# longbridge/gpui-fast's compat/gpui-pre-web, moved to 0.3.12.
[package]
name = "gpui-pre-web"
version = "0.3.12"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "gpui_web"
path = "lib.rs"
doctest = false

[features]
default = ["gpui_fast/default"]
multithreaded = ["gpui_fast/multithreaded"]

[dependencies]
gpui_fast = { package = "gpui-fast-web", version = "=0.1.14", default-features = false }
