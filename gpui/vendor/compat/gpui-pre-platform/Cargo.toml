# gpui-fast-platform under the name and version GPUI Kit 0.9.1 pins (gpui-pre-platform =0.3.12),
# so GPUI Kit and everything built on gpui-pre run on GPUI Fast - after
# longbridge/gpui-fast's compat/gpui-pre-platform, moved to 0.3.12.
[package]
name = "gpui-pre-platform"
version = "0.3.12"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "gpui_platform"
path = "lib.rs"
doctest = false

[features]
default = ["gpui_fast/default"]
bench-support = ["gpui_fast/bench-support"]
font-kit = ["gpui_fast/font-kit"]
inspector = ["gpui_fast/inspector"]
multithreaded = ["gpui_fast/multithreaded"]
runtime_shaders = ["gpui_fast/runtime_shaders"]
screen-capture = ["gpui_fast/screen-capture"]
test-support = ["gpui_fast/test-support"]
wayland = ["gpui_fast/wayland"]
x11 = ["gpui_fast/x11"]

[dependencies]
gpui_fast = { package = "gpui-fast-platform", version = "=0.1.14", default-features = false }
