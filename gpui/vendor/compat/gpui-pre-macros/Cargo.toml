# gpui-fast-macros under the name and version GPUI Kit 0.9.1 pins (gpui-pre-macros =0.3.12),
# so GPUI Kit and everything built on gpui-pre run on GPUI Fast - after
# longbridge/gpui-fast's compat/gpui-pre-macros, moved to 0.3.12.
[package]
name = "gpui-pre-macros"
version = "0.3.12"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "gpui_macros"
path = "lib.rs"
doctest = false

[features]
inspector = ["gpui_fast/inspector"]

[dependencies]
gpui_fast = { package = "gpui-fast-macros", version = "=0.1.14", default-features = false }
