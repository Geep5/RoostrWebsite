[package]
name = "roostr-graph"
description = "Per-space schema/object graph"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
roostr-core.workspace = true
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
web-time.workspace = true
chrono.workspace = true
lyon = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

# Labels are laid out by Core Text in the system fonts the web uses (SF Pro,
# SF Mono) and tessellated by lyon into world-space meshes.
[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21.0"
core-foundation = "0.10"
core-graphics = "0.24"

# Elsewhere usvg (SVG text semantics, the version gpui renders SVGs with) lays
# them out: in the system fonts on a desktop, in the bundled fonts in a browser.
# resvg (gpui's own) rasterizes color-outline (COLR) emoji glyphs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
usvg = { version = "0.46", default-features = false, features = ["text"] }
resvg = { version = "0.46", default-features = false }
ttf-parser = "0.25"

[target.'cfg(not(any(target_os = "macos", target_family = "wasm")))'.dependencies]
usvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
