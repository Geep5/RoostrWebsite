[package]
name = "roostr-app"
description = "The Roostr app shared by the desktop binary and the browser build: every feature crate plugged into the shell, the page per route, the object page"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
roostr-core.workspace = true
roostr-rt.workspace = true
roostr-ui.workspace = true
roostr-properties.workspace = true
roostr-editor.workspace = true
roostr-sets.workspace = true
roostr-discussion.workspace = true
roostr-graph.workspace = true
roostr-settings.workspace = true
roostr-site.workspace = true
roostr-shell.workspace = true
rune.workspace = true
log.workspace = true

# The tests drive the assembled app headless (rune::Runtime) over fake vaults.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
roostr-host.workspace = true
anyhow.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
