[package]
name = "roostr-engine"
description = "The shared Odin engine (glonOdin) behind Roostr's replicas: a static library on the desktop and iOS, the site's engine.wasm in the browser"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"
links = "glon"

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

# Browser: fetch engine.wasm + engine-core.json, check the hash, instantiate.
[target.'cfg(target_family = "wasm")'.dependencies]
sha2.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Crypto",
    "Performance",
    "Request",
    "RequestCache",
    "RequestInit",
    "Response",
    "Window",
    "WorkerGlobalScope",
] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
futures.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[build-dependencies]
sha2.workspace = true
serde_json.workspace = true
