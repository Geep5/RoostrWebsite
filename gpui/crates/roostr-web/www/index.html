<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#1e1e20" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- page head: scripts/build-web.sh writes each page's title and meta here -->
    <!-- Every path (/app/object/<id>, /guide, …) is served one of these pages:
         everything below is relative to the site root. -->
    <base href="/" />
    <link rel="modulepreload" href="roostr_web.js" />
    <link rel="preload" href="roostr_web_bg.wasm" as="fetch" type="application/wasm" crossorigin />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* App-like touch: Rune pans and flings the canvas itself; no
         double-tap zoom, no rubber band, no orientation text inflation. */
      html { touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #141416;
        color: #f5f5f7;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Matches the app's own loading card (roostr-shell progress_card). */
      #loading {
        position: fixed;
        z-index: 1;
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(380px, calc(100vw - 32px));
        padding: 14px;
        border: 1px solid #45454a;
        border-radius: 12px;
        background: #2b2b2e;
        color: #98989d;
        font-size: 12px;
      }
      #loading .title { color: #f5f5f7; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
      #loading .bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(237, 207, 127, 0.2);
        overflow: hidden;
        margin-bottom: 10px;
      }
      #loading .bar::after {
        content: "";
        display: block;
        width: 35%;
        height: 100%;
        border-radius: 3px;
        background: #edcf7f;
        animation: sweep 1s linear infinite;
      }
      @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(286%); } }
      .error { color: #ff9d94; pointer-events: auto; max-width: 480px; }
      .error h2 { font-size: 17px; margin-bottom: 8px; color: #f5f5f7; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="title">Loading Roostr</div>
      <div class="bar"></div>
      <p>Starting the app…</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
