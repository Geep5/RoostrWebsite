<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#1e1e20" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- page head: scripts/build-web.sh writes each page's title and meta here -->
    <!-- Every path (/app/object/<id>, /guide, …) is served one of these pages:
         everything below is relative to the site root. -->
    <base href="/" />
    <link rel="modulepreload" href="roostr_web.js" />
    <link rel="preload" href="roostr_web_bg.wasm" as="fetch" type="application/wasm" crossorigin />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* App-like touch: no double-tap zoom, no orientation text inflation. */
      html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #141416;
        color: #f5f5f7;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body > canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #loading {
        position: fixed;
        z-index: 1;
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #98989d;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 14px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-left-color: #f2c14e;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error { color: #ff9d94; pointer-events: auto; max-width: 480px; }
      .error h2 { font-size: 17px; margin-bottom: 8px; color: #f5f5f7; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading Roostr…</p>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
