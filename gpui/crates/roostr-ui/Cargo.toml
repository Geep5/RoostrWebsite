[package]
name = "roostr-ui"
description = "Roostr's design system on Rune: theme, type, fonts, icons, motion and shared components"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rune.workspace = true
rune-kit.workspace = true
base64.workspace = true
percent-encoding.workspace = true
chrono.workspace = true

[[example]]
name = "gallery"

[dev-dependencies]
ttf-parser = "0.25"

# Native file dialogs on the desktop (Rune refuses the feature on the web). Every Rune crate
# depends on roostr-ui, so this one place gives them all the same Rune build.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rune = { workspace = true, features = ["native-file-dialog"] }
